name: Build & Release

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  PLUGIN_NAME: AutoRetainer
  TZ: Asia/Tokyo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          $dalamud = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip $dalamud
          "DALAMUD_HOME=$dalamud" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set timezone
        run: Set-TimeZone -Id "Tokyo Standard Time"

      - name: Restore
        run: dotnet restore ${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.csproj

      - name: Build
        run: dotnet build ${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.csproj -c Release -maxcpucount:1 --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ env.PLUGIN_NAME }}
          path: ${{ env.PLUGIN_NAME }}/bin/Release/

      - name: Zip release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $packaged = Get-ChildItem -Path .\${{ env.PLUGIN_NAME }}\bin\Release -Recurse -Filter latest.zip | Select-Object -First 1
          if($packaged) {
            Copy-Item $packaged.FullName .\${{ env.PLUGIN_NAME }}.zip
          } else {
            Compress-Archive -Path .\${{ env.PLUGIN_NAME }}\bin\Release\* -DestinationPath .\${{ env.PLUGIN_NAME }}.zip
          }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ env.PLUGIN_NAME }}.zip
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
